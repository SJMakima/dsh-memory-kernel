name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies (prebuilt native modules)
        run: npm ci
      - name: Test suite (331+ cases, serial like the release gate to avoid wall-clock flake)
        run: node --test --test-concurrency=1 && node scripts/check-facade.mjs
      - name: Privacy red lines (gate: failure must exit non-zero)
        run: npm run eval:privacy
